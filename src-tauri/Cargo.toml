[package]
name = "shirin-hesab"
version = "0.8.0"
edition = "2021"
description = "شیرین حساب — مدیریت حساب فروشگاه کیک و شیرینی"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
# موتور آپدیت
ureq = "2"
zip = "2"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# بهینه‌سازی برای سیستم‌های ضعیف: باینری کوچک‌تر و اجرای سریع‌تر
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
