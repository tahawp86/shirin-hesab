name: Release ShirinHesab

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      run_id:
        description: 'Build run ID to take the artifact from (empty = latest successful build)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build run id
        id: resolve
        run: |
          if [ -z "${{ inputs.run_id }}" ]; then
            RID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id')
          else
            RID="${{ inputs.run_id }}"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Using run $RID"

      - name: Download build artifact (bundle + standalone exe)
        uses: actions/download-artifact@v4
        with:
          name: ShirinHesab-windows
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Download build manifest
        uses: actions/download-artifact@v4
        with:
          name: ShirinHesab-manifest
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./build-meta

      # مانیفست بیلد قبلی از داخل بسته‌ی آپدیت آخرین ریلیز قبلی خوانده می‌شود؛
      # اگر ریلیز قبلی بسته‌ی آپدیت نداشت، بسته‌ی این نسخه «کامل» ساخته می‌شود.
      - name: Fetch previous release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          PREV_TAG=$(gh release list --limit 50 --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != "${{ inputs.tag }}" and .tagName != "update-feed")] | sort_by(.createdAt) | last | .tagName // empty')
          echo "Previous release: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            if gh release download "$PREV_TAG" --pattern 'ShirinHesab-Update-*.zip' --dir prev-rel; then
              FULL_ZIP=$(ls prev-rel/ShirinHesab-Update-v*.zip | grep -v -- '-from-' | head -n 1 || true)
              if [ -n "$FULL_ZIP" ]; then unzip -o -j "$FULL_ZIP" manifest.json -d prev/ || true; fi
            fi
          fi
          ls -la prev/ || true

      # مدل جدید انتشار: بسته‌ی کامل (سازگار با موتور قدیمی) + بسته‌ی دلتا از
      # نسخه‌ی قبلی + update-feed.json برای موتور جدید
      - name: Build update packages and feed
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p stage update-dist
          cp ./artifact/*.exe stage/
          cp CHANGELOG_FA.md stage/
          cp LICENSE LICENSE-MIT LICENSE-APACHE COPYRIGHT THIRD-PARTY-NOTICES.md stage/
          PREV_ARG=""
          if [ -f prev/manifest.json ]; then PREV_ARG="--prev-manifest prev/manifest.json"; fi
          python3 tools/make_feed.py --build-dir stage --version "$VERSION" \
            --changelog CHANGELOG_FA.md --repo "${{ github.repository }}" \
            $PREV_ARG --out-dir update-dist
          ls -la update-dist/

      # بادی ریلیز: خط همین نسخه از بخش «تغییرات نسخه‌های اخیر» در README
      - name: Prepare release body from README
        run: |
          LINE=$(grep -F "نسخه‌ی ${{ env.VERSION }}" README.md | head -n 1 || true)
          if [ -z "$LINE" ]; then LINE="شیرین حساب ${{ inputs.tag }}"; fi
          printf '%s\n' "$LINE" > release-body.md
          cat release-body.md

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ShirinHesab ${{ inputs.tag }}
          body_path: release-body.md
          files: |
            ./artifact/**/*-setup.exe
            ./update-dist/ShirinHesab-Update-v*.zip

      # فید ثابت موتور آپدیت: update-feed.json در ریلیز ثابت «update-feed» منتشر
      # می‌شود و هر بار همان یک فایل جایگزین می‌شود تا آدرس فید همیشه ثابت بماند:
      # https://github.com/tahawp86/shirin-hesab/releases/download/update-feed/update-feed.json
      # (prerelease است تا هیچ‌وقت «آخرین ریلیز» مخزن نشود.)
      - name: Publish update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view update-feed > /dev/null 2>&1; then
            gh release create update-feed --prerelease \
              --title "Update Feed" \
              --notes "فایل فید موتور آپدیت (update-feed.json) — برای دانلود دستی نیست؛ موتور آپدیت برنامه آن را می‌خواند."
          fi
          gh release upload update-feed update-dist/update-feed.json --clobber
          echo "Feed published: https://github.com/${{ github.repository }}/releases/download/update-feed/update-feed.json"
